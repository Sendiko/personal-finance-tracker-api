services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-personal_finance}
      MYSQL_USER: ${DB_USER:-finance}
      MYSQL_PASSWORD: ${DB_PASS:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_PORT: 3000
      DB_NAME: ${DB_NAME:-personal_finance}
      DB_USER: ${DB_USER:-finance}
      DB_PASS: ${DB_PASS:-change-me}
      DB_HOST: db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    ports:
      - "${APP_PORT:-3000}:3000"
    command: ["sh", "-c", "npm run db:migrate && npm start"]

volumes:
  mysql_data:
